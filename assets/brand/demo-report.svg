    <text x="50" y="156" fill="#312451" font-size="55" font-weight="700">把灵感，留在今天。</text>
    <text x="54" y="203" fill="#6e5d87" font-size="22">一份关于交流、创造和共同成长的记录</text>
    <rect x="50" y="250" width="545" height="220" rx="22" fill="#fff"/>
